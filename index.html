<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>PLU ARMY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
<style>
  :root{
    --plu-yellow:#FFD100;
    --plu-black:#141414;
    --plu-maroon:#9C1B3D;
    --plu-olive:#4B5320;
    --plu-cream:#FFF8E1;
    --plu-gray:#6b6b6b;
    --chat-bg:#EDE3C8;
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  html{height:100%;overflow:hidden;}
  body{
    height:100%;
    height:100dvh;
    background:var(--plu-cream);color:var(--plu-black);
    position:fixed;inset:0;width:100%;
    display:flex;flex-direction:column;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* HEADER */
  header{
    background:var(--plu-black);
    color:var(--plu-yellow);
    padding:16px 18px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:4px solid var(--plu-yellow);
    flex-shrink:0;
    flex-grow:0;
    z-index:5;
  }
  header .logo-mark{
    width:48px;height:48px;border-radius:50%;
    object-fit:cover;
    border:2px solid var(--plu-yellow);
  }
  header h1{
    font-family:'Archivo Black',sans-serif;
    font-size:17px;
    letter-spacing:0.5px;
  }
  header span.tag{
    font-size:11px;color:var(--plu-cream);opacity:0.7;display:block;font-weight:400;
  }
  #header-stats{display:flex;gap:6px;margin-top:6px;}
  .stat-pill{
    background:rgba(255,255,255,0.1);
    color:var(--plu-cream);
    font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:20px;
    display:flex;align-items:center;gap:4px;
  }
  .stat-pill.unread{background:var(--plu-maroon);color:white;display:none;}
  .online-dot{width:6px;height:6px;border-radius:50%;background:#3ddc71;display:inline-block;flex-shrink:0;}

  .new-messages-divider{
    display:flex;align-items:center;justify-content:center;
    margin:14px 0;position:relative;
  }
  .new-messages-divider span{
    background:var(--plu-maroon);color:white;font-size:11px;font-weight:700;
    padding:4px 14px;border-radius:20px;letter-spacing:0.3px;
  }

  /* AUTH SCREEN */
  #auth-screen{
    max-width:420px;margin:40px auto;padding:0 20px;
  }
  .card{
    background:white;border-radius:14px;padding:28px 24px;
    box-shadow:0 2px 14px rgba(0,0,0,0.08);
    border-top:6px solid var(--plu-maroon);
  }
  .card h2{
    font-family:'Archivo Black',sans-serif;
    font-size:20px;margin-bottom:6px;
  }
  .card p.sub{color:var(--plu-gray);font-size:13px;margin-bottom:20px;}
  label{display:block;font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--plu-black);}
  input{
    width:100%;padding:11px 12px;border:1.5px solid #ddd;border-radius:8px;
    font-size:16px;font-family:'Inter',sans-serif;
  }
  input:focus{outline:none;border-color:var(--plu-maroon);}
  button.primary{
    width:100%;margin-top:20px;padding:13px;
    background:var(--plu-maroon);color:white;border:none;border-radius:8px;
    font-weight:700;font-size:14px;cursor:pointer;
    transition:background 0.15s;
  }
  button.primary:hover{background:#7d1631;}
  button.primary:disabled{background:#ccc;cursor:not-allowed;}
  #auth-error{color:var(--plu-maroon);font-size:12px;margin-top:10px;display:none;}

  /* CHAT LAYOUT */
  #feed-screen{
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0; /* allows child to scroll instead of pushing page */
  }

  #posts-list{
    flex:1;
    overflow-y:auto;
    /* Note: overflow-anchor is intentionally left at its default (auto) here.
       It lets the browser automatically keep your reading position stable
       when a photo or voice note finishes loading and the bubble grows —
       an organic size change, distinct from the full-list-reload case
       (new messages), which is handled by explicit scroll math elsewhere. */
    padding:16px 12px;
    background-color:var(--chat-bg);
    /* Three layers, front to back: the existing subtle dot texture, then
       the wallpaper photo. The photo itself was pre-blurred and darkened
       before being embedded here (rather than blurring it live with CSS
       filter), so it stays soft/out-of-focus behind the chat without any
       extra rendering cost while scrolling. */

  .bubble-row{
    display:flex;margin-bottom:10px;position:relative;touch-action:pan-y;
    -webkit-user-select:none;user-select:none; /* stop native text highlighting on long-press */
    -webkit-touch-callout:none; /* stop iPhone's built-in copy/share popup on long-press */
  }
  .bubble-row *{
    -webkit-user-select:none !important;user-select:none !important;
    -webkit-touch-callout:none !important;
  }
  .bubble-row.mine{justify-content:flex-end;}
  .swipe-hint{
    position:absolute;top:50%;right:2px;transform:translateY(-50%);
    font-size:16px;opacity:0;transition:opacity 0.1s;
  }

  .bubble{
    max-width:78%;
    background:white;
    border-radius:12px;
    padding:8px 10px 6px;
    box-shadow:0 1px 2px rgba(0,0,0,0.12);
    position:relative;
  }
  .bubble.media-bubble{padding:3px;}
  .bubble-row.mine .bubble{background:#FFF3B0;}
  .bubble.pinned{border-left:4px solid var(--plu-maroon);}

  .bubble .name{
    font-size:12.5px;font-weight:700;color:var(--plu-maroon);margin-bottom:2px;
  }
  .bubble.pinned .name::before{content:"📌 ";}
  .bubble-row.mine .bubble .name{color:var(--plu-olive);}

  .bubble .content{
    font-size:14px;line-height:1.4;white-space:pre-wrap;color:var(--plu-black);
    word-break:break-word;overflow-wrap:anywhere;
  }
  .bubble .content img{max-width:100%;border-radius:9px;display:block;}
  .bubble.media-bubble .content{margin:0;}
  .bubble.media-bubble .name{padding:3px 6px 0;}
  .bubble.media-bubble .content > div:first-child{padding:3px 6px 4px;margin-bottom:0 !important;}
  .bubble .content audio{width:220px;max-width:100%;margin-top:4px;}

  .bubble .meta-row{
    display:flex;align-items:center;gap:10px;margin-top:4px;justify-content:flex-end;
  }
  .bubble .time{font-size:10.5px;color:var(--plu-gray);}
  .bubble .sent-tick{font-size:10.5px;color:var(--plu-gray);margin-left:2px;}
  .bubble .bubble-actions{display:flex;gap:8px;}
  .bubble .bubble-actions button{
    background:none;border:none;font-size:11px;color:var(--plu-gray);cursor:pointer;
    display:flex;align-items:center;gap:2px;font-weight:600;
  }
  .bubble .bubble-actions button.liked{color:var(--plu-maroon);}

  .avatar-sm{
    width:28px;height:28px;border-radius:50%;background:var(--plu-olive);
    color:white;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:11px;flex-shrink:0;margin-right:6px;align-self:flex-end;
  }
  .bubble-row.mine .avatar-sm{display:none;}
  .bubble-wrap{display:flex;align-items:flex-end;max-width:78%;}
  .bubble-row.mine .bubble-wrap{max-width:100%;}

  .empty-state{text-align:center;color:var(--plu-gray);padding:40px 20px;font-size:14px;}

  /* COMPOSER — pinned to bottom like WhatsApp */
  .composer{
    flex-shrink:0;
    flex-grow:0;
    background:#F0EEE5;
    padding:8px 10px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    border-top:1px solid #ddd;
    z-index:5;
  }
  .composer .icon-btn{
    background:none;border:none;font-size:20px;cursor:pointer;padding:6px;
    flex-shrink:0;line-height:1;
  }
  .composer .icon-btn.recording{
    background:var(--plu-maroon);border-radius:50%;color:white;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(156,27,61,0.5);}
    70%{box-shadow:0 0 0 10px rgba(156,27,61,0);}
    100%{box-shadow:0 0 0 0 rgba(156,27,61,0);}
  }
  .composer .input-wrap{
    flex:1;
    min-width:0; /* lets flex child shrink instead of forcing overflow */
    background:white;
    border-radius:22px;
    padding:9px 14px;
    display:flex;
    align-items:center;
  }
  .composer textarea{
    flex:1;min-width:0;border:none;resize:none;font-family:'Inter',sans-serif;
    font-size:16px;max-height:90px;outline:none;line-height:1.3;
    word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
    transition:height 0.15s ease; /* smooth grow/shrink so it moves in step with the keyboard, no gap */
  }
  .send-btn{
    width:40px;height:40px;border-radius:50%;background:var(--plu-black);color:var(--plu-yellow);
    border:none;font-size:16px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .send-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .attach-preview{
    font-size:11px;color:var(--plu-maroon);padding:2px 12px;background:#F0EEE5;
  }
  .attach-preview.media-thumb{
    display:flex;align-items:center;gap:8px;padding:8px 12px;
  }
  .attach-preview.media-thumb img{
    width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0;
  }
  .attach-preview.media-thumb .remove-attach{
    margin-left:auto;background:none;border:none;font-size:16px;cursor:pointer;color:var(--plu-gray);
  }
  .reply-preview{
    display:none;
    align-items:center;justify-content:space-between;
    background:#F0EEE5;padding:8px 12px;border-left:4px solid var(--plu-maroon);
    margin:0 10px;border-radius:6px 6px 0 0;
  }
  .reply-preview .rp-text{font-size:12px;color:var(--plu-black);}
  .reply-preview .rp-text b{color:var(--plu-maroon);}
  .reply-preview button{background:none;border:none;font-size:16px;cursor:pointer;color:var(--plu-gray);}

  .quoted-block{
    background:rgba(0,0,0,0.05);
    border-left:3px solid var(--plu-maroon);
    padding:4px 8px;border-radius:6px;margin-bottom:5px;
    font-size:12px;
  }
  .quoted-block b{color:var(--plu-maroon);display:block;font-size:11px;}
  .quoted-block span{color:var(--plu-gray);}
</style>
</head>

<div id="auth-screen">
  <div class="card">

    <!-- Step 1: choose Join or Log in -->
    <div id="auth-choice">
      <h2>Welcome to PLU ARMY</h2>
      <p class="sub">Are you new here, or already part of the group?</p>
      <button class="primary" onclick="selectAuthMode('join')">Join the group</button>
      <button class="primary" style="margin-top:10px;background:var(--plu-olive);" onclick="selectAuthMode('login')">I already have an account</button>

      <h2 id="auth-heading">Join PLU ARMY</h2>
      <p class="sub" id="auth-subtext">Enter your details to join the group. Your name will be shown on your posts.</p>
      <div id="join-only-fields">
        <label>Profile picture (optional)</label>
        <div id="avatar-preview-wrap" style="display:flex;align-items:center;gap:12px;margin-top:6px;">

      <label>Phone number</label>

<script>
// ====== CONFIG ======
const SUPABASE_URL = "https://jrocnhulratyfwcjlrtq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9mfzGWil4ryMSxBKeuLKYQ_42ctbBRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let pendingMedia = null; // {type: 'image'|'audio', file: File}
let pendingAvatar = null; // File
let replyingTo = null; // {id, name, snippet}

// Captured once when the app loads — this is the "you last saw the chat at
// this time" marker used to figure out what's new. It intentionally does
// NOT update continuously, so the "New messages" divider stays in place
// while you're reading, instead of jumping around.
const sessionLastSeen = localStorage.getItem('plu_army_last_seen') || new Date(0).toISOString();

function updateLastSeen(){
  localStorage.setItem('plu_army_last_seen', new Date().toISOString());
}

function previewAvatar(){
  const input = document.getElementById('reg-avatar');
  if(input.files[0]){
    pendingAvatar = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('avatar-preview').style.backgroundImage = `url(${e.target.result})`;
    };
    reader.readAsDataURL(pendingAvatar);
  }
}

function openLightbox(url){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display = 'none';
}

// ====== PROFILE EDITING ======
let pendingEditAvatar = null; // File, only set if the user picks a new photo

function openProfileEditor(){
  document.getElementById('edit-name').value = currentUser.name;
  const preview = document.getElementById('edit-avatar-preview');
  preview.style.backgroundImage = currentUser.avatar_url ? `url(${currentUser.avatar_url})` : 'none';
  pendingEditAvatar = null;
  document.getElementById('profile-edit-error').style.display = 'none';
  document.getElementById('profile-editor').style.display = 'flex';
}

function closeProfileEditor(){
  document.getElementById('profile-editor').style.display = 'none';
}

async function logOut(){
  if(!confirm("Log out of PLU ARMY on this device?")) return;
  await sb.auth.signOut();
  location.reload();
}

function previewAvatarEdit(){
  const input = document.getElementById('edit-avatar');
  if(input.files[0]){
    pendingEditAvatar = input.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('edit-avatar-preview').style.backgroundImage = `url(${e.target.result})`;
    };
    reader.readAsDataURL(pendingEditAvatar);
  }
}

async function saveProfile(){
  const newName = document.getElementById('edit-name').value.trim();
  const errEl = document.getElementById('profile-edit-error');
  errEl.style.display = 'none';

  if(!newName){
    errEl.textContent = "Name can't be empty.";
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('save-profile-btn').disabled = true;
  document.getElementById('save-profile-btn').textContent = "Saving...";

  const updates = { name: newName };

  if(pendingEditAvatar){
    const compressed = await compressImage(pendingEditAvatar);
    const path = `avatars/${currentUser.id}_${Date.now()}.jpg`;
    const { error: avatarErr } = await sb.storage.from('post-media').upload(path, compressed);
    if(avatarErr){
      errEl.textContent = "Couldn't upload photo — please try again.";
      errEl.style.display = 'block';
      document.getElementById('save-profile-btn').disabled = false;
      document.getElementById('save-profile-btn').textContent = "Save changes";
      return;
    }
    const { data: urlData } = sb.storage.from('post-media').getPublicUrl(path);
    updates.avatar_url = urlData.publicUrl;
  }

  const { data: updated, error } = await sb.from('users').update(updates).eq('id', currentUser.id).select().single();

  document.getElementById('save-profile-btn').disabled = false;
  document.getElementById('save-profile-btn').textContent = "Save changes";

  if(error){
    errEl.textContent = "Couldn't save changes — please try again.";
    errEl.style.display = 'block';
    return;
  }

  currentUser = updated;
  closeProfileEditor();
  loadPosts(); // refresh so the new name/photo show on past messages too
}

// ====== MESSAGE ACTIONS (long-press menu) ======
let messageMenuTarget = null; // the post the menu currently refers to

// "Delete for me" is local-only — it hides a message just on this device,
// without touching the database or affecting anyone else.
function getHiddenForMe(){
  try{
    return JSON.parse(localStorage.getItem('plu_army_hidden_posts') || '[]');

// ====== AUTH ======
// Keeps the phone field to digits only, with an optional single leading +
// (e.g. +256772000000) — strips letters, symbols, and extra + signs as
// the person types, instead of letting them type anything endlessly.
function sanitizePhoneInput(el){
  const hasPlus = el.value.trim().startsWith('+');
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = (hasPlus ? '+' : '') + digits;
}

// Turns any Ugandan phone number the person types into one consistent
// form, so "0772000000", "772000000", and "+256772000000" all match the
// same account instead of being treated as three different people.
// Canonical form: digits only, starting with the 256 country code.
function normalizePhone(raw){
  let digits = raw.replace(/[^0-9]/g, '');
  if(digits.startsWith('0')){
    digits = '256' + digits.slice(1);       // 0772... -> 256772...
  } else if(digits.startsWith('256')){
    // already in country-code form, leave as is
  } else if(digits.length === 9){
    digits = '256' + digits;                // 772... -> 256772...
  }
  return digits;
}

async function registerUser(){
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  const location = document.getElementById('reg-location').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if(!name || !phone || !password){
    errEl.textContent = "Please fill in your name, phone number, and password.";
    errEl.style.display = 'block';
    return;
  }

  const digitsOnly = phone.replace(/[^0-9]/g, '');
  if(digitsOnly.length < 9 || digitsOnly.length > 13){
    errEl.textContent = "Please enter a valid phone number.";
    errEl.style.display = 'block';
    return;
  }

  if(password.length < 6){
    errEl.textContent = "Password needs to be at least 6 characters.";
    errEl.style.display = 'block';
    return;
  }

  const normalizedPhone = normalizePhone(phone);
  // Supabase's phone-based login requires a real SMS provider (Twilio,
  // etc.) just to switch it on, even with confirmations off — which
  // means real per-message cost. To avoid that, we use Supabase's Email
  // login instead, but turn each phone number into a fake internal email
  // address behind the scenes. Nobody ever sees or types this — it's
  // never a real inbox, just something Supabase's login system can use
  // as a unique identifier tied to a password.
  const authEmail = normalizedPhone + '@plu-army.local';
  const busyLabel = authMode === 'login' ? "Logging in..." : "Joining...";
  const idleLabel = authMode === 'login' ? "Log in" : "Join the group";
  document.getElementById('join-btn').disabled = true;
  document.getElementById('join-btn').textContent = busyLabel;

  if(authMode === 'login'){
    const { data, error } = await sb.auth.signInWithPassword({ email: authEmail, password });
    if(error || !data.user){
      errEl.textContent = "Wrong phone number or password.";
      errEl.style.display = 'block';
      document.getElementById('join-btn').disabled = false;
      document.getElementById('join-btn').textContent = idleLabel;
      return;
    }

    const { data: profile } = await sb.from('users').select('*').eq('id', data.user.id).maybeSingle();
    if(!profile){
      errEl.textContent = "Account found, but no profile on file. Contact an admin.";
      errEl.style.display = 'block';
      document.getElementById('join-btn').disabled = false;
      document.getElementById('join-btn').textContent = idleLabel;
      return;
    }
    if(!profile.is_active){
      errEl.textContent = "This account has been deactivated. Contact an admin.";
      errEl.style.display = 'block';
      await sb.auth.signOut();
      document.getElementById('join-btn').disabled = false;
      document.getElementById('join-btn').textContent = idleLabel;
      return;
    }
    if(profile.name.trim().toLowerCase() !== name.toLowerCase()){
      errEl.textContent = "That name doesn't match the account for this phone number.";
      errEl.style.display = 'block';
      await sb.auth.signOut();
      document.getElementById('join-btn').disabled = false;
      document.getElementById('join-btn').textContent = idleLabel;
      return;
    }

    currentUser = profile;
    enterFeed();
    return;
  }

  // authMode === 'join'
  const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email: authEmail, password });
  if(signUpError || !signUpData.user){
    // Show the real reason Supabase gave, not a vague message — makes it
    // possible to tell "wrong dashboard setting" from "weak password"
    // from "already registered" at a glance instead of guessing.
    errEl.textContent = signUpError?.message?.includes('registered')
      ? "That phone number already has an account — try logging in instead."
      : (signUpError?.message || "Something went wrong creating your account. Please try again.");
    errEl.style.display = 'block';
    document.getElementById('join-btn').disabled = false;
    document.getElementById('join-btn').textContent = idleLabel;
    return;
  }

  let avatarUrl = null;
  if(pendingAvatar){
    const compressed = await compressImage(pendingAvatar);
    const path = `avatars/${signUpData.user.id}_${Date.now()}.jpg`;
    const { error: avatarErr } = await sb.storage.from('post-media').upload(path, compressed);
    if(!avatarErr){
      const { data: urlData } = sb.storage.from('post-media').getPublicUrl(path);
      avatarUrl = urlData.publicUrl;
    }
  }

  const { data: newUser, error: profileError } = await sb
    .from('users')
    .insert({ id: signUpData.user.id, name, phone: normalizedPhone, location, avatar_url: avatarUrl })
    .select()
    .single();
  if(profileError){
    errEl.textContent = "Account created, but your profile couldn't be saved. Please contact an admin.";
    errEl.style.display = 'block';
    document.getElementById('join-btn').disabled = false;
    document.getElementById('join-btn').textContent = idleLabel;
    return;
  }

  currentUser = newUser;
  enterFeed();
}

  document.addEventListener('touchstart', dismiss, { passive: true });

}

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

// Converts any recorded audio blob into MP3 — the one format that plays
// reliably on every phone (Android recordings in webm won't play on
// iPhone at all, so we standardize everything to MP3 right after recording).
async function convertToMp3(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioCtx();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  const sampleRate = audioBuffer.sampleRate;
  const samples = audioBuffer.getChannelData(0); // mono
  const int16Samples = new Int16Array(samples.length);
  for(let i = 0; i < samples.length; i++){
    const s = Math.max(-1, Math.min(1, samples[i]));
    int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }

  const encoder = new lamejs.Mp3Encoder(1, sampleRate, 96);
  const mp3Chunks = [];
  const blockSize = 1152;
  for(let i = 0; i < int16Samples.length; i += blockSize){
    const chunk = int16Samples.subarray(i, i + blockSize);
    const buf = encoder.encodeBuffer(chunk);
    if(buf.length > 0) mp3Chunks.push(buf);
  }
  const end = encoder.flush();
  if(end.length > 0) mp3Chunks.push(end);

  audioCtx.close();
  return new Blob(mp3Chunks, { type: 'audio/mp3' });
}

async function finalizeRecording(stream, preview){
  const rawBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
  preview.textContent = "⏳ Processing voice note...";
  try{
    const mp3Blob = await convertToMp3(rawBlob);
    const file = new File([mp3Blob], `voice_${Date.now()}.mp3`, { type: 'audio/mp3' });
    pendingMedia = { type: 'audio', file };
    preview.style.display = 'block';
    preview.textContent = `🎙️ Voice note recorded — hit send.`;
  }catch(err){
    // Fallback: send the raw recording if conversion fails for any reason
    const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'm4a' : 'webm';
    const file = new File([rawBlob], `voice_${Date.now()}.${ext}`, { type: mediaRecorder.mimeType || 'audio/webm' });
    pendingMedia = { type: 'audio', file };
    preview.style.display = 'block';
    preview.textContent = `🎙️ Voice note recorded — hit send.`;
  }
  stream.getTracks().forEach(t => t.stop());
}

async function toggleRecording(){
  const micBtn = document.getElementById('mic-btn');
  const preview = document.getElementById('attach-preview');

  if(!isRecording){
    // Start recording
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(err){
      alert("Couldn't access the microphone. Please allow microphone permission and try again.");
      return;
    }
    recordedChunks = [];

    const preferredTypes = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
    const chosenType = preferredTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = chosenType ? new MediaRecorder(stream, { mimeType: chosenType }) : new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => finalizeRecording(stream, preview);
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.title = "Tap to stop recording";
    preview.style.display = 'block';
    preview.textContent = "🔴 Recording... tap the mic again to stop.";
  } else {
    // Stop recording
    mediaRecorder.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.title = "Record voice note";
  }
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

// Resets the composer box to its single-line resting height after
// sending. This briefly turns off the CSS transition and forces the
// height directly, instead of animating to it — animating a <textarea>'s
// height back to "auto" is unreliable on some phones (notably iOS
// Safari) and can leave the box stuck at its expanded size. Killing the
// transition guarantees it lands at the right size every time; typing
// again still grows/shrinks smoothly since the transition is restored
// right after.
function resetComposerHeight(el){
  el.style.transition = 'none';
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  void el.offsetHeight; // force the browser to apply that height before restoring the transition
  el.style.transition = '';
}

// Shrinks a photo in the browser before upload so it sends and loads fast.
// Caps the longest side at 1280px and compresses to ~75% JPEG quality.
function compressImage(file){
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    img.onload = () => {
      const maxSide = 1280;
      let { width, height } = img;
      if(width > maxSide || height > maxSide){
        if(width > height){ height = Math.round(height * (maxSide / width)); width = maxSide; }
        else { width = Math.round(width * (maxSide / height)); height = maxSide; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        if(!blob){ resolve(file); return; } // fallback to original if compression fails
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.75);
    };
    img.onerror = () => resolve(file); // fallback to original if it can't be read
    reader.readAsDataURL(file);
  });
}

// ====== POSTS ======
async function submitPost(){
  const textEl = document.getElementById('post-text');
  const text = textEl.value.trim();

  // If the user taps Send while still recording, finish the recording first
  // instead of silently losing it.
  if(isRecording){
    await new Promise(resolve => {
      const stream = mediaRecorder.stream;
      mediaRecorder.onstop = async () => {
        await finalizeRecording(stream, document.getElementById('attach-preview'));
        resolve();
      };
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
    });
  }

  if(!text && !pendingMedia){ return; }

  // Capture everything now, then clear the composer immediately so it
  // feels instant — the actual upload/save happens quietly afterward.
  const capturedText = text;
  const capturedMedia = pendingMedia;
  const capturedReplyTo = replyingTo ? replyingTo.id : null;

  textEl.value = '';
  resetComposerHeight(textEl);
  // (No forced re-focus here — letting the box and keyboard settle
  // together naturally looks smoother than fighting the keyboard open.)
  pendingMedia = null;
  cancelReply();
  clearAttachment();

  // Show the message on screen right away, using a local preview for any
  // photo/voice note, before the network upload has even started.
  const list = document.getElementById('posts-list');
  const tempId = 'temp-' + Date.now();
  let localUrl = null;
  if(capturedMedia){
    localUrl = URL.createObjectURL(capturedMedia.file);
  }
  const tempPost = {
    id: tempId,
    user_id: currentUser.id,
    type: capturedMedia ? capturedMedia.type : 'text',
    content: capturedMedia ? JSON.stringify({url: localUrl, caption: capturedText}) : capturedText,
    is_pinned: false,
    reply_to: capturedReplyTo,
    created_at: new Date().toISOString(),
    users: { name: currentUser.name, avatar_url: currentUser.avatar_url },
    likes: [],
    _sending: true
  };
  lastById[tempId] = tempPost;
  list.insertAdjacentHTML('beforeend', renderPost(tempPost, lastById));
  list.scrollTop = list.scrollHeight;

  // Now do the real upload/save in the background
  let type = 'text';
  let content = capturedText;

  if(capturedMedia){
    type = capturedMedia.type;
    let file = capturedMedia.file;
    if(type === 'image'){
      file = await compressImage(file);
    }
    const path = `${currentUser.id}/${Date.now()}_${file.name}`;
    const { error: uploadErr } = await sb.storage.from('post-media').upload(path, file);
    if(uploadErr){
      alert("Upload failed: " + uploadErr.message + " — please check your internet connection and try again.");
      const tempEl = document.querySelector(`[data-temp-id="${tempId}"]`);
      if(tempEl) tempEl.remove();
      return;
    }
    const { data: urlData } = sb.storage.from('post-media').getPublicUrl(path);
    content = JSON.stringify({url: urlData.publicUrl, caption: capturedText});
  }

  const { error } = await sb.from('posts').insert({user_id: currentUser.id, type, content, reply_to: capturedReplyTo});

  if(error){
    alert("Couldn't post: " + error.message + " — please try again.");
    const tempEl = document.querySelector(`[data-temp-id="${tempId}"]`);
    if(tempEl) tempEl.remove();
    return;
  }
  // The realtime subscription will reload the real post shortly and
  // replace this temporary one automatically.
}

let lastById = {};

let dismissedUpTo = null; // timestamp of "read up to here" — lets the badge correctly reappear for new messages after a dismissal

async function loadPosts(){
  const [{ data: rawPosts, error }, { count: totalUsers }] = await Promise.all([
    sb.from('posts')
      .select('*, users(name, avatar_url), likes(user_id)')
      .eq('is_deleted', false)
      .order('is_pinned', {ascending:false})
      .order('created_at', {ascending:true}), // oldest first — newest ends up at the bottom, next to the text box
    sb.from('users').select('id', { count: 'exact', head: true })
  ]);

  const list = document.getElementById('posts-list');
  if(error){ list.innerHTML = `<div class="empty-state">Couldn't load the feed. Refresh to try again.</div>`; return; }

  // Total stat = everyone who has ever joined PLU ARMY, not message count
  document.getElementById('stat-total').textContent = totalUsers || 0;

  const hiddenForMe = getHiddenForMe();
  const posts = (rawPosts || []).filter(p => !hiddenForMe.includes(p.id));

  if(!posts.length){ list.innerHTML = `<div class="empty-state">No messages yet. Be the first to share something.</div>`; return; }

  // Remember where the user was reading before we redraw the list
  const wasNearBottom = (list.scrollTop + list.clientHeight) >= (list.scrollHeight - 80);
  const prevScrollHeight = list.scrollHeight;
  const prevScrollTop = list.scrollTop;

  const byId = {};
  posts.forEach(p => byId[p.id] = p);
  lastById = byId;

  // Figure out which messages are "new since last visit" (for the unread
  // badge and the divider line). Uses whichever is later: the timestamp
  // from when this session started, or the point the user last dismissed
  // the badge — so it correctly reappears for genuinely new messages.
  const effectiveSince = (dismissedUpTo && dismissedUpTo > sessionLastSeen) ? dismissedUpTo : sessionLastSeen;
  const unreadPosts = posts.filter(p => p.user_id !== currentUser.id && new Date(p.created_at) > new Date(effectiveSince));
  document.getElementById('stat-unread').textContent = unreadPosts.length;
  document.getElementById('stat-unread-pill').style.display = unreadPosts.length > 0 ? 'flex' : 'none';
  const firstUnreadId = unreadPosts.length ? unreadPosts[0].id : null;

  let html = '';
  posts.forEach(p => {
    if(p.id === firstUnreadId){
      html += `<div class="new-messages-divider" id="new-messages-marker"><span>New messages</span></div>`;
    }
    html += renderPost(p, byId);
  });
  list.innerHTML = html;
  attachSwipeHandlers(posts);

  // Once the user actually scrolls down to the "New messages" line, hide
  // the unread badge — they're viewing those messages now.
  if(firstUnreadId){
    const marker = document.getElementById('new-messages-marker');
    if(marker){
      const observer = new IntersectionObserver((entries) => {
        if(entries[0].isIntersecting){
          dismissedUpTo = new Date().toISOString();
          document.getElementById('stat-unread-pill').style.display = 'none';
          observer.disconnect();
        }
      }, { root: list, threshold: 0.5 });
      observer.observe(marker);
    }
  }

  if(wasNearBottom){
    // Watching the latest messages — instantly reveal the new one at the bottom
    list.scrollTop = list.scrollHeight;
    updateLastSeen(); // they're actively viewing the latest, so mark as read
  } else {
    // Reading older messages further up — keep them in the same spot,
    // don't yank the view down to the newest message
    const heightDiff = list.scrollHeight - prevScrollHeight;
    list.scrollTop = prevScrollTop + heightDiff;
  }
}

function attachSwipeHandlers(posts){
  const rows = document.querySelectorAll('.bubble-row');
  rows.forEach((row, idx) => {
    const p = posts[idx];
    if(p._sending) return; // don't attach actions to a still-sending optimistic bubble
    const bubbleWrap = row.querySelector('.bubble-wrap');
    const hint = row.querySelector('.swipe-hint');
    let startX = 0, dx = 0, dragging = false, longPressFired = false;
    let longPressTimer = null;

    const startLongPress = () => {
      longPressFired = false;
      longPressTimer = setTimeout(() => {
        longPressFired = true;
        if(navigator.vibrate) navigator.vibrate(15); // small haptic tick, if supported
        openMessageMenu(p);
      }, 500);
    };
    const cancelLongPress = () => {
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
    };

    row.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      dragging = true;
      startLongPress();
    }, {passive: true});

    row.addEventListener('touchmove', e => {
      if(!dragging) return;
      dx = e.touches[0].clientX - startX;
      if(Math.abs(dx) > 10) cancelLongPress(); // real swipe, not a long-press
      // Only respond to a leftward swipe — ignore rightward drags entirely
      const clamped = Math.max(Math.min(dx, 0), -60);
      bubbleWrap.style.transform = `translateX(${clamped}px)`;
      hint.style.opacity = Math.min(Math.abs(clamped) / 50, 1);
    }, {passive: true});

    row.addEventListener('touchend', () => {
      cancelLongPress();
      if(!dragging) return;
      dragging = false;
      bubbleWrap.style.transition = 'transform 0.15s';
      bubbleWrap.style.transform = 'translateX(0)';
      hint.style.opacity = 0;
      setTimeout(() => { bubbleWrap.style.transition = ''; }, 150);

      if(!longPressFired && dx < -45){
        startReply(p.id, p.users?.name || 'Unknown', snippetFor(p));
      }
      dx = 0;
    });

    // Desktop equivalent: press-and-hold with the mouse
    row.addEventListener('mousedown', startLongPress);
    row.addEventListener('mouseup', cancelLongPress);
    row.addEventListener('mouseleave', cancelLongPress);
    row.addEventListener('contextmenu', e => { e.preventDefault(); openMessageMenu(p); });
  });
}

function snippetFor(p){
  if(!p) return '(message unavailable)';
  if(p.type === 'text') return (p.content || '').slice(0, 60);
  if(p.type === 'image') return '📷 Photo';
  if(p.type === 'audio') return '🎙️ Voice note';
  return '';
}

function renderPost(p, byId){
  const name = p.users?.name || 'Unknown';
  const initials = escapeHtml(name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase());
  const avatarUrl = p.users?.avatar_url;
  const avatarInner = avatarUrl
    ? `<img src="${avatarUrl}" alt="${escapeHtml(name)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
    : initials;
  const avatarClickAttr = avatarUrl ? `onclick="openLightbox('${avatarUrl}')" style="cursor:pointer;"` : '';
  const time = new Date(p.created_at).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  const likedByMe = (p.likes || []).some(l => l.user_id === currentUser.id);
  const likeCount = (p.likes || []).length;
  // The heart turns red for everyone once ANYONE has liked the post —
  // likedByMe is kept separately below just to decide what tapping the
  // heart does for this particular user (add vs remove their own like).
  const hasAnyLikes = likeCount > 0;
  const isMine = p.user_id === currentUser.id;

  let quoted = '';
  if(p.reply_to && byId[p.reply_to]){
    const parent = byId[p.reply_to];
    quoted = `<div class="quoted-block"><b>${escapeHtml(parent.users?.name || 'Unknown')}</b><span>${escapeHtml(snippetFor(parent))}</span></div>`;
  }

  let body = '';
  if(p.type === 'text'){
    body = escapeHtml(p.content);
  } else {
    const parsed = JSON.parse(p.content);
    if(p.type === 'image'){
      body = (parsed.caption ? `<div style="margin-bottom:4px;">${escapeHtml(parsed.caption)}</div>` : '') +
             `<img src="${parsed.url}" alt="posted image" loading="lazy" decoding="async" onclick="openLightbox('${parsed.url}')" style="cursor:pointer;">`;
    } else if(p.type === 'audio'){
      body = (parsed.caption ? `<div style="margin-bottom:4px;">${escapeHtml(parsed.caption)}</div>` : '') +
             `<audio controls src="${parsed.url}"></audio>`;
    }
  }

  const editedTag = p.is_edited ? `<span style="font-size:10px;color:var(--plu-gray);margin-right:4px;">(edited)</span>` : '';
  // A single check after the time means the message made it to the server —
  // it only shows on the sender's own messages, once the optimistic
  // "Sending…" bubble has been replaced by the real, saved post.
  const sentTick = (isMine && !p._sending) ? `<span class="sent-tick" title="Sent">✓</span>` : '';
  const sendingTag = p._sending ? `<span style="opacity:0.6;font-size:10px;">Sending…</span>` : `${editedTag}<span class="time">${time}</span>${sentTick}`;

  return `
  <div class="bubble-row ${isMine ? 'mine' : ''}" data-post-id="${p.id}" ${p._sending ? `data-temp-id="${p.id}"` : ''}>
    <span class="swipe-hint">↩️</span>
    <div class="bubble-wrap" style="${p._sending ? 'opacity:0.75;' : ''}">
      ${!isMine ? `<div class="avatar-sm" ${avatarClickAttr}>${avatarInner}</div>` : ''}
      <div class="bubble ${p.is_pinned ? 'pinned' : ''} ${p.type === 'image' ? 'media-bubble' : ''}">
        ${!isMine ? `<div class="name">${escapeHtml(name)}</div>` : ''}
        ${quoted}
        <div class="content">${body}</div>
        <div class="meta-row">
          <div class="bubble-actions">
            ${!p._sending ? `<button class="like-btn ${hasAnyLikes ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${likedByMe})">${hasAnyLikes ? '❤️' : '🤍'} ${likeCount}</button>
            <button onclick="reportPost('${p.id}')">🚩</button>` : ''}
          </div>
          ${sendingTag}
        </div>
      </div>
    </div>
  </div>`;
}

async function toggleLike(postId, currentlyLiked){
  // Flip the heart instantly, before waiting on the network — the realtime
  // update that follows will just confirm/reconcile the same state, so
  // there's no need to make the person wait to see it.
  const row = document.querySelector(`.bubble-row[data-post-id="${postId}"]`);
  const likeBtn = row?.querySelector('.like-btn');
  if(likeBtn){
    const currentCount = parseInt(likeBtn.textContent.trim().split(' ').pop(), 10) || 0;
    const newLiked = !currentlyLiked;
    const newCount = currentCount + (newLiked ? 1 : -1);
    const hasAnyLikes = newCount > 0;
    likeBtn.className = 'like-btn' + (hasAnyLikes ? ' liked' : '');
    likeBtn.innerHTML = `${hasAnyLikes ? '❤️' : '🤍'} ${newCount}`;
    likeBtn.setAttribute('onclick', `toggleLike('${postId}', ${newLiked})`);
  }

  if(currentlyLiked){
    await sb.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
  } else {
    await sb.from('likes').insert({post_id: postId, user_id: currentUser.id});
  }
  // No direct loadPosts() here — the realtime subscription below already
  // reconciles the true state on every like change. Calling it twice
  // caused the screen jump.
}

async function reportPost(postId){
  const reason = prompt("Why are you reporting this post? (optional — press OK to submit, Cancel to back out)");
  if(reason === null) return; // user pressed Cancel — don't report anything
  const { error } = await sb.from('reports').insert({post_id: postId, reported_by: currentUser.id, reason: reason || null});
  if(error){ alert("Couldn't submit the report — please try again."); return; }
  alert("Reported. An admin will review this post.");
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ====== REALTIME (messages appear instantly, no refresh needed) ======
function setupRealtime(){
  sb.channel('public:posts')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadPosts())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, (payload) => handleLikeChange(payload))
    .subscribe();
}

// Patches just the one heart icon that changed, instead of rebuilding the
// whole message list. This is what actually stops the scroll jump — a full
// rebuild was always fragile (it depended on browser scroll-position
// quirks), whereas patching one element in place can never move the scroll
// position at all.
async function handleLikeChange(payload){
  const postId = payload.new?.post_id || payload.old?.post_id;
  if(!postId) return;

  const { data: likes } = await sb.from('likes').select('user_id').eq('post_id', postId);
  const likedByMe = (likes || []).some(l => l.user_id === currentUser.id);
  const likeCount = (likes || []).length;
  const hasAnyLikes = likeCount > 0;

  // Keep the cached copy in sync too, so later full reloads (new messages,
  // replies, etc.) still show the correct like state for this post.
  if(lastById[postId]) lastById[postId].likes = likes || [];

  const row = document.querySelector(`.bubble-row[data-post-id="${postId}"]`);
  if(!row) return; // not currently visible (e.g. hidden for this user) — nothing to patch
  const likeBtn = row.querySelector('.like-btn');
  if(!likeBtn) return;
  likeBtn.className = 'like-btn' + (hasAnyLikes ? ' liked' : '');
  likeBtn.innerHTML = `${hasAnyLikes ? '❤️' : '🤍'} ${likeCount}`;
  likeBtn.setAttribute('onclick', `toggleLike('${postId}', ${likedByMe})`);
}

// ====== ONLINE PRESENCE ======
function setupPresence(){
  const channel = sb.channel('online-users', {
    config: { presence: { key: currentUser.id } }
  });
  channel.on('presence', { event: 'sync' }, () => {
    const state = channel.presenceState();
    const onlineCount = Object.keys(state).length;
    document.getElementById('stat-online').textContent = onlineCount;
  });
  channel.subscribe(async (status) => {
    if(status === 'SUBSCRIBED'){
      await channel.track({ user_id: currentUser.id, name: currentUser.name });
    }
  });
}

// ====== KEEP HEADER VISIBLE WHEN THE KEYBOARD OPENS ======
// On some phones (notably iPhone), opening the on-screen keyboard scrolls
// the whole page up to keep the text box visible — which pushes our fixed
// header off the top of the screen. This keeps the app's actual height
// matched to the real visible area, so the header never gets pushed away,
// and the text box always sits right above the keyboard with no gap.
if(window.visualViewport){
  const syncBodyHeight = () => {
    document.body.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
  };

  const jumpToLatest = () => {
    document.getElementById('posts-list').scrollTop = document.getElementById('posts-list').scrollHeight;
  };

  // Only a real resize (the keyboard actually opening or closing) re-syncs
  // height and jumps to the latest message. We deliberately do NOT listen
  // for visualViewport's "scroll" event here — it also fires from Safari's
  // toolbar collapsing/expanding as the person scrolls the chat, and
  // resetting body height on every one of those ticks is what made the
  // composer visibly bounce up and back during a normal scroll. The app is
  // already pinned to the screen via position:fixed, so scroll events don't
  // need any height correction at all.
  window.visualViewport.addEventListener('resize', () => {
    syncBodyHeight();
    jumpToLatest();
  });

  syncBodyHeight();
  jumpToLatest();

  // Also react the instant the text box is tapped/left, rather than only
  // waiting for the browser's own (sometimes delayed) resize event — this
  // keeps the box locked to the keyboard's position as it animates open.
  // Multiple timing catches since keyboard animation speed varies by device.
  const postTextEl = document.getElementById('post-text');
  postTextEl.addEventListener('focus', () => {
    syncBodyHeight();
    jumpToLatest();
    [50, 150, 300, 500].forEach(ms => setTimeout(() => { syncBodyHeight(); jumpToLatest(); }, ms));
  });
  postTextEl.addEventListener('blur', () => {
    [50, 150, 300, 500].forEach(ms => setTimeout(syncBodyHeight, ms));
  });
} else {
  // Fallback for older browsers without visualViewport support
  window.addEventListener('resize', () => {
    document.getElementById('posts-list').scrollTop = document.getElementById('posts-list').scrollHeight;
  });
}

// ====== STOP DOUBLE-TAP FROM ZOOMING THE SCREEN ======
// iPhone ignores the viewport meta restriction on zoom for accessibility
// reasons, so double-tapping anywhere can still zoom the page in. This
// catches the double-tap gesture directly and cancels it.
let lastTapTime = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if(now - lastTapTime <= 300){
    e.preventDefault();
  }
  lastTapTime = now;
}, { passive: false });

// ====== INIT ======
tryAutoLogin();
setupRealtime();
</script>
